name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ecosystem inventory and project documentation
        run: |
          python -m json.tool project-map.json > /dev/null
          python -m py_compile tests/test_ecosystem_inventory.py tests/test_project_blueprint.py
      - name: Run focused starter tests
        run: |
          python -m unittest discover -s tests -p 'test_ecosystem_inventory.py' -v
          python -m unittest discover -s tests -p 'test_project_blueprint.py' -v
