name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; else echo "No tests directory yet; syntax validation passed."; fi
